<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Buddy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📘 AI Exam Buddy</h1>
    <p>Smart Student Study Assistant</p>

    <div class="card">
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter name">

        <label>Subject</label>
        <input type="text" id="subject" placeholder="Maths / Science">

        <label>Marks</label>
        <input type="number" id="marks" placeholder="Enter marks">

        <label>Days Left for Exam</label>
        <input type="number" id="days" placeholder="Enter days">

        <button onclick="analyze()">Generate Plan</button>
    </div>

    <div class="result" id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
